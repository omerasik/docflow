name: DocFlow CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: docflow_ci
          POSTGRES_PASSWORD: ephemeral-ci-only
          POSTGRES_DB: docflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docflow_ci -d docflow_ci"
          --health-interval 5s --health-timeout 3s --health-retries 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: pip install -r requirements-dev.txt
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils tesseract-ocr tesseract-ocr-eng
      - run: ruff check document_flow tests
      - run: pytest -q
        env:
          DOCFLOW_TEST_DATABASE_URL: postgresql+psycopg://docflow_ci:ephemeral-ci-only@127.0.0.1:5432/docflow_ci
          DOCFLOW_REQUIRE_OCR_TEST: "true"
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: pip-audit -r requirements-dev.txt
      - run: npm --prefix web audit --audit-level=moderate
